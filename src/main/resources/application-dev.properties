# Dev-only profile. Activated by `./gradlew bootRun` (see build.gradle.kts).
# The packaged jar runs with no profile, so none of this applies in deploy.

# OpenAPI / Swagger UI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Verbose logging (kept out of the base/prod config)
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG