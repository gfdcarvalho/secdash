openapi: 3.1.0
info:
  title: Secdash API
  description: Dashboard de vulnerabilidades de segurança multi-repositório que agrega
    resultados de análise estática (SAST) e dependency scanning de repositórios alojados
    no GitHub e no GitLab.
  contact:
    name: "Rodrigo Vitorino (nº 49448), Gonçalo Carvalho (nº 49219)"
    url: https://github.com/gfdcarvalho/secdash
  version: 0.0.1
externalDocs:
