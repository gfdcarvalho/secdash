components:
  schemas:
    UserCreationModel:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        email:
          type: string
      required:
      - email
      - password
      - username
    AuthenticatedUser:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required:
      - token
      - user
    User:
      type: object
      properties:
        uid:
          type: integer
          format: int32
        name:
          type: string
        email:
          type: string
        passwordValidation:
          type:
          - string
          - "null"
        role:
          type: string
          enum:
          - ADMIN
          - USER
      required:
      - email
      - name
      - role
      - uid
    TeamCreationInput:
      type: object
      properties:
        name:
          type: string
        description:
          type:
          - string
          - "null"
      required:
      - name
    TeamUserInput:
      type: object
      properties:
        userId:
          type: integer
          format: int32
      required:
      - userId
    TeamRepositoryInput:
      type: object
      properties:
        repositoryId:
          type: integer
          format: int32
      required:
      - repositoryId
    ExternalOwner:
      type: object
      properties:
        externalId:
          type: string
        name:
          type: string
        url:
          type: string
        avatarUrl:
          type:
          - string
          - "null"
        platform:
          type: string
          enum:
          - GITHUB
          - GITLAB
      required:
      - externalId
      - name
      - platform
      - url
    RepositoryCreationDto:
      type: object
      properties:
        name:
          type:
          - string
          - "null"
        externalId:
          type:
          - string
          - "null"
        externalOwner:
          oneOf:
          - $ref: "#/components/schemas/ExternalOwner"
          - type: "null"
        htmlUrl:
          type:
          - string
          - "null"
        description:
          type:
          - string
          - "null"
        issuesCount:
          type:
          - integer
          - "null"
          format: int32
        createdAt:
